[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Partitune"
version = "0.0.1"
authors = [
  { name="Samuel Espejo Gil", email="samuel.espejo@alu.uclm.es" },
  { name="Elena Ballesteros Morallón", email="elena.ballesteros2@alu.uclm.es" },
  { name="Marcelo Chinarro Cabrero", email="marcelo.chinarro@alu.uclm.es" },
  { name="Jorge Burgos Ortega", email="jorge.burgos1@alu.uclm.es" },
]
description = "Conversor Partitune a ABC"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "antlr4-python3-runtime==4.13.2",
  "graphviz==0.20.3",
  "networkx==3.4.2",
]

[project.urls]
"Repository" = "https://github.com/RedBed24/procesadores_2425"

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"
dependencies = [
  "antlr4-tools==0.2.1",
  "hatchling==1.26.3",
]

[tool.hatch.build]
dev-mode-dirs = ["src/main/python"]

[tool.hatch.build.targets.wheel]
packages = ["src/main/python/partitune"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
partitune = "partitune.__main__:main"
